name: Check CV and search metadata

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate HTML, structured data, crawler access and sitemap
        run: python3 scripts/check_site.py
      - name: Validate portfolio relationships and generated discovery resources
        run: |
          node scripts/build_portfolio.cjs --check
          python3 scripts/check_portfolio.py
          python3 scripts/check_social.py
      - name: Validate opt-in analytics and cookie consent
        run: node scripts/check_analytics.cjs
      - name: Validate device theme and dark-mode contrast
        run: python3 scripts/check_theme.py
